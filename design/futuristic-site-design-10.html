<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOTION｜近未来デザイン10案</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#080b10;color:#f4f5f7}
    *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #d7f16c;outline-offset:3px}
    .top{padding:48px max(24px,calc((100vw - 1320px)/2));border-bottom:1px solid #303842;background:radial-gradient(circle at 83% 0%,#263455 0,transparent 35%),#0c1118}
    .eyebrow{font-size:11px;letter-spacing:.2em;color:#d7f16c;font-weight:800}.top h1{font-size:clamp(32px,4.5vw,60px);line-height:1.12;letter-spacing:-.06em;margin:12px 0 14px}.top p{max-width:820px;color:#b6c0c8;line-height:1.8;font-size:14px}.top small{display:block;color:#8996a1;font-size:11px;line-height:1.7}
    .switcher{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;overflow:auto;padding:13px max(24px,calc((100vw - 1320px)/2));background:#0c1118ef;border-bottom:1px solid #38424d;backdrop-filter:blur(14px)}.switcher span{white-space:nowrap;font-size:11px;color:#98a5ad;margin-right:12px}.switcher button{flex:none;border:1px solid #49535e;background:#1c252e;color:#cbd4da;border-radius:999px;padding:9px 17px;font-size:12px}.switcher button[aria-pressed="true"]{background:#d7f16c;border-color:#d7f16c;color:#11170c;font-weight:800}
    .board{max-width:1370px;margin:auto;padding:28px 24px 80px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.concept{display:grid;grid-template-columns:minmax(0,1fr) 238px;gap:20px;min-width:0;padding:24px;background:#121921;border:1px solid #33404a;border-radius:22px}.concept-text{display:flex;flex-direction:column;min-width:0}.number{font-size:11px;color:#92a2ae;letter-spacing:.18em}.concept h2{font-size:25px;line-height:1.25;letter-spacing:-.05em;margin:10px 0}.tagline{color:#e4e9ec;font-size:13px;line-height:1.7;margin:0 0 14px}.facts{margin:auto 0 0;padding:0;list-style:none;display:grid;gap:9px}.facts li{font-size:11px;color:#aab7c0;line-height:1.6;padding-left:13px;border-left:2px solid var(--accent)}.colors{display:flex;gap:6px;margin-top:18px}.colors i{width:23px;height:23px;border-radius:50%;border:1px solid #ffffff4d}.recommend{display:inline-block;width:max-content;margin-top:12px;border:1px solid #5a6945;border-radius:999px;color:#d7f16c;font-size:10px;padding:4px 9px}
    .phone{--bg:#060b14;--surface:#172333;--accent:#c8ff79;--secondary:#7c71ff;--ink:#f4f6f7;--muted:#a3b2c3;position:relative;overflow:hidden;height:476px;width:238px;background:var(--bg);color:var(--ink);border:4px solid #36414a;border-radius:31px;box-shadow:0 20px 35px #0009;isolation:isolate}.phone::before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(circle at 60% 25%,color-mix(in srgb,var(--secondary),transparent 56%),transparent 45%),linear-gradient(var(--bg),var(--bg))}.phone-head{height:41px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid #ffffff20}.phone-head strong{font-size:13px;letter-spacing:-.07em}.phone-head strong b{color:var(--accent)}.phone-head em{font-size:8px;font-style:normal;color:var(--accent);letter-spacing:.12em}.screen{height:385px;overflow:hidden;padding:12px 13px 4px}.screen h3{font-size:16px;letter-spacing:-.05em;line-height:1.3;margin:5px 0 6px}.screen p{font-size:9px;color:var(--muted);line-height:1.5;margin:0}.screen .label{color:var(--accent);font-size:8px;font-weight:800;letter-spacing:.14em}.art{height:138px;position:relative;overflow:hidden;border-radius:12px;margin:13px 0;background:radial-gradient(circle at 55% 44%,var(--secondary),transparent 42%),#111821}.art::before{content:"";position:absolute;inset:16px;border:1px solid #ffffff70;border-radius:50%;transform:rotate(-22deg) scaleY(.65)}.art::after{content:"✦";position:absolute;top:36px;left:43%;font-size:45px;color:var(--accent);text-shadow:0 0 25px var(--accent)}.phone .mock-label{font-size:8px;color:var(--muted);margin:4px 0 7px}.chips{display:flex;gap:5px;overflow:hidden;white-space:nowrap}.chips span{display:inline-flex;align-items:center;min-height:24px;padding:4px 7px;border:1px solid #ffffff40;border-radius:99px;font-size:8px;background:var(--surface)}.chips span:first-child{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:800}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:11px}.mini-card{height:83px;border-radius:7px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--secondary),#131a22 70%)}.mini-card:nth-child(2){background:linear-gradient(135deg,var(--accent),#1a1f26 70%)}.mini-card:nth-child(3){background:linear-gradient(135deg,#b45482,#17161d 70%)}.mini-card::before{content:"";position:absolute;inset:10px 17px 22px;border-radius:50%;background:#ffffff62;filter:blur(8px)}.mini-card span{position:absolute;bottom:3px;left:4px;right:4px;font-size:7px;line-height:1.1;text-shadow:0 1px 4px #000}.mock-input{margin-top:10px;padding:10px;border:1px solid #ffffff45;background:var(--surface);border-radius:9px;font-size:8px;color:var(--muted)}.mock-cta{margin-top:9px;background:var(--accent);color:var(--bg);border-radius:8px;padding:8px;text-align:center;font-size:9px;font-weight:900}.phone-tabs{position:absolute;bottom:0;left:0;right:0;height:44px;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--bg),transparent 5%);border-top:1px solid #ffffff30}.phone-tabs span{display:grid;place-items:center;align-content:center;font-size:7px;color:var(--muted);line-height:1.3}.phone-tabs b{font-size:14px;font-weight:400}.phone-tabs span:first-child{color:var(--accent)}
    .screen[data-screen="browse"] .cards{grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.screen[data-screen="browse"] .mini-card{height:123px}.screen[data-screen="browse"] .mock-label{margin-top:16px}.screen[data-screen="detail"] .art{height:233px;margin-top:7px}.screen[data-screen="detail"] .mock-cta{margin-top:14px}.screen[data-screen="settings"] .setting-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #ffffff30;font-size:9px}.screen[data-screen="settings"] .setting-row span:last-child{color:var(--accent)}
    .phone[data-theme="neon"]{--bg:#080a13;--surface:#24213a;--accent:#ff6fbd;--secondary:#63e5ff}.phone[data-theme="neon"] .art{background:linear-gradient(180deg,#17233b,#7b294e 65%,#1c0e1f)}.phone[data-theme="neon"] .art::before{border:0;border-radius:0;inset:30px 0 0;background:repeating-linear-gradient(90deg,#131b2a 0 18px,#2a3857 18px 33px,#111825 33px 40px);transform:none;clip-path:polygon(0 50%,15% 29%,30% 55%,44% 10%,61% 50%,78% 0,100% 40%,100% 100%,0 100%)}.phone[data-theme="neon"] .art::after{content:"NIGHT / 2040";font-size:14px;left:18px;top:75px;letter-spacing:.16em}
    .phone[data-theme="glass"]{--bg:#0a1420;--surface:#35455b99;--accent:#b6f7ee;--secondary:#d3c6ff}.phone[data-theme="glass"] .art{background:linear-gradient(135deg,#7ea6b5aa,#7f6db4a0),#101d2a;border:1px solid #ffffffa0;backdrop-filter:blur(10px)}.phone[data-theme="glass"] .chips span,.phone[data-theme="glass"] .mock-input{backdrop-filter:blur(12px);border-color:#ffffff7a}
    .phone[data-theme="control"]{--bg:#050709;--surface:#1d2427;--accent:#d7f16c;--secondary:#8aa2b0}.phone[data-theme="control"] .art{border:1px solid #8aa2b0;border-radius:6px;background:radial-gradient(circle,#424c63,#0a0d12 75%)}.phone[data-theme="control"] .art::before{border-radius:0;transform:none;border:2px solid #d7f16c8a;inset:9px}.phone[data-theme="control"] .art::after{content:"● REC";font-size:11px;left:18px;top:17px;text-shadow:none}
    .phone[data-theme="prism"]{--bg:#0b0d16;--surface:#24203a;--accent:#f4e7ff;--secondary:#a780ff}.phone[data-theme="prism"] .art{background:conic-gradient(from 35deg,#a780ff,#d66aba,#53a5d8,#a780ff)}.phone[data-theme="prism"] .art::before{inset:18px 35px;border-radius:7px;transform:rotate(16deg);background:#101421a8}.phone[data-theme="prism"] .art::after{content:"01 / STYLE";font-size:18px;left:46px;top:53px}
    .phone[data-theme="lunar"]{--bg:#101218;--surface:#1f2530;--accent:#f1f0e8;--secondary:#b7d2e8}.phone[data-theme="lunar"] .screen h3{font-size:22px}.phone[data-theme="lunar"] .art{background:radial-gradient(circle at 75% 30%,#c5d5d9 0 20%,#617484 21%,#202b38 40%,#11151b 70%)}.phone[data-theme="lunar"] .art::before{display:none}.phone[data-theme="lunar"] .art::after{content:"MOON / 01";font-size:10px;left:14px;top:112px;text-shadow:none}
    .phone[data-theme="quantum"]{--bg:#071019;--surface:#16303a;--accent:#6df3e3;--secondary:#ffcf70}.phone[data-theme="quantum"] .art{border-radius:3px;background:linear-gradient(90deg,#1c4854 0 48%,#142334 48% 100%)}.phone[data-theme="quantum"] .art::before{inset:12px 12px 12px 50%;border-radius:3px;transform:none;background:#ffcf7066}.phone[data-theme="quantum"] .art::after{content:"▦";font-size:58px;top:30px;left:33px}
    .phone[data-theme="aurora"]{--bg:#050a11;--surface:#172536;--accent:#79d8ff;--secondary:#d78cff}.phone[data-theme="aurora"] .art{background:linear-gradient(145deg,transparent 15%,#79d8ff66 27%,#d78cff 48%,#79d8ff99 57%,transparent 72%),#080f1d}.phone[data-theme="aurora"] .art::before{border:0;transform:rotate(-16deg);border-radius:50%;background:#ffffff2b;filter:blur(18px)}.phone[data-theme="aurora"] .art::after{content:"AURORA";left:26px;top:64px;font-size:20px}
    .phone[data-theme="cinema"]{--bg:#08070c;--surface:#241b21;--accent:#ff8e79;--secondary:#e8d6c5}.phone[data-theme="cinema"] .art{background:linear-gradient(120deg,#3a1828,#925046 50%,#1b111d);border-radius:2px}.phone[data-theme="cinema"] .art::before{border:0;inset:18px 62px 0;background:linear-gradient(#e8d6c5,#682f39);border-radius:55% 55% 0 0;transform:none}.phone[data-theme="cinema"] .art::after{content:"SCENE 01";font-size:16px;top:103px;left:18px}
    .phone[data-theme="blueprint"]{--bg:#071118;--surface:#142b35;--accent:#b9f1e2;--secondary:#7ba6cf}.phone[data-theme="blueprint"] .screen{background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px);background-size:20px 20px}.phone[data-theme="blueprint"] .art{background:#143342;border:1px solid #b9f1e2;border-radius:0}.phone[data-theme="blueprint"] .art::before{border:1px dashed #b9f1e2;border-radius:0;transform:none;inset:15px}.phone[data-theme="blueprint"] .art::after{content:"01 / IDEA";font-size:16px;top:55px;left:31px}
    @media(max-width:980px){.board{grid-template-columns:1fr;max-width:680px}}@media(max-width:560px){.top{padding:30px 18px}.board{padding:16px 12px 60px}.concept{grid-template-columns:1fr;padding:18px}.phone{margin:4px auto 0}.facts{margin-top:0}.switcher{padding-inline:15px}.switcher span{display:none}}
  </style>
</head>
<body>
  <header class="top"><span class="eyebrow">MOTION / FUTURE DESIGN STUDY</span><h1>近未来のMOTION、<br>10の方向。</h1><p>同じサービスを10種類のデザイン言語で表現したスマホ画面のモックです。上の切り替えで、ホーム・探す・詳細・設定を横断して比べられます。</p><small>デザイン検討用の静的プレビューです。作例・ボタン・設定項目はイメージで、動画生成機能はありません。</small></header>
  <div class="switcher" role="group" aria-label="表示する画面"><span>SCREEN VIEW</span><button type="button" data-screen="home" aria-pressed="true">ホーム</button><button type="button" data-screen="browse" aria-pressed="false">探す</button><button type="button" data-screen="detail" aria-pressed="false">詳細</button><button type="button" data-screen="settings" aria-pressed="false">設定</button></div>
  <main class="board" id="board"></main>
  <script>
    const ideas=[
      {n:'01',name:'軌道スタジオ',theme:'orbital',colors:['#060B14','#C8FF79','#7C71FF'],tag:'アイデアが巡る、動画の宇宙。',points:['カテゴリーを球体の周囲に集約','軌道の線で選択状態を示す','自由記入欄も同じカードに統合'],badge:'現行から発展しやすい'},
      {n:'02',name:'ネオンシティ',theme:'neon',colors:['#080A13','#FF6FBD','#63E5FF'],tag:'夜の都市で、次の一本を探す。',points:['夜景のような強い第一印象','案内標識風のカテゴリー','タップしたカードの輪郭だけ光る']},
      {n:'03',name:'透明な未来',theme:'glass',colors:['#0A1420','#B6F7EE','#D3C6FF'],tag:'透明な面に、アイデアを重ねる。',points:['ガラス面で情報を区切る','入力とナビの質感を統一','濃い選択状態で読みやすくする']},
      {n:'04',name:'映像管制室',theme:'control',colors:['#050709','#D7F16C','#8AA2B0'],tag:'選んだ世界観を、REC枠に収める。',points:['今のREC枠をサイト全体へ展開','番号とタイムコードで作品を整理','録画・生成中と誤解させない'],badge:'現行デザインに最も近い'},
      {n:'05',name:'プリズム図書館',theme:'prism',colors:['#0B0D16','#F4E7FF','#A780FF'],tag:'色とジャンルで、作例に出会う。',points:['カテゴリーを色ごとの棚に分ける','大きな作例カードを2列表示','お気に入りをブックマーク風に'],badge:'作例が増える場合に有効'},
      {n:'06',name:'月面エディトリアル',theme:'lunar',colors:['#101218','#F1F0E8','#B7D2E8'],tag:'静かな余白が、映像を引き立てる。',points:['大きな日本語見出しと余白','作例を雑誌のように並べる','色と動きを抑えて長く使う']},
      {n:'07',name:'量子タイル',theme:'quantum',colors:['#071019','#6DF3E3','#FFCF70'],tag:'アイデアを、組み合わせて選ぶ。',points:['カテゴリーをタイルで整理','増えるジャンルにも対応','設定も同じタイル構造に'],badge:'カテゴリー拡張に強い'},
      {n:'08',name:'オーロラフロー',theme:'aurora',colors:['#050A11','#79D8FF','#D78CFF'],tag:'光の流れで、次の発想へ。',points:['光の帯で視線を誘導','作例ごとに細い色ライン','入力時は背景演出を停止']},
      {n:'09',name:'サイバーシネマ',theme:'cinema',colors:['#08070C','#FF8E79','#E8D6C5'],tag:'縦長の作例を、作品の主役に。',points:['劇場のように暗い背景','縦長ポスターを大きく見せる','詳細は作例・説明・案内の順'],badge:'作例を目立たせたい場合に有効'},
      {n:'10',name:'未来の設計図',theme:'blueprint',colors:['#071118','#B9F1E2','#7BA6CF'],tag:'作りたい映像を、順に組み立てる。',points:['番号付きの分かりやすい手順','縦横比と用途を図面風に表示','日本語の操作名を優先']}
    ];
    const board=document.querySelector('#board');let current='home';
    const card=(title)=>`<div class="mini-card"><span>${title}</span></div>`;
    function screenHtml(screen,idea){
      if(screen==='browse')return `<span class="label">EXPLORE / 15 CATEGORIES</span><h3>スタイルを探す。</h3><p>気になる世界観から選ぼう。</p><div class="chips"><span>すべて</span><span>映画風</span><span>旅行</span><span>特殊効果</span></div><div class="mock-label">STYLE LIBRARY · 09</div><div class="cards">${['ランウェイウォーク','浮かぶ商品','夕暮れのポートレート','ネオン街を歩く'].map(card).join('')}</div>`;
      if(screen==='detail')return `<span class="label">STYLE / 01</span><div class="art"></div><h3>ランウェイウォーク</h3><p>一歩ごとに視線を集める。シルエットや質感を印象的に見せるスタイル。</p><div class="mock-cta">先行案内を受け取る ↗</div>`;
      if(screen==='settings')return `<span class="label">MY SPACE</span><h3>設定</h3><p>案内と保存したスタイルを確認。</p><div class="art"></div><div class="setting-row"><span>お気に入り</span><span>›</span></div><div class="setting-row"><span>プライバシーポリシー</span><span>›</span></div><div class="setting-row"><span>お問い合わせ</span><span>›</span></div>`;
      return `<span class="label">DISCOVER / MOTION</span><h3>${idea.tag}</h3><p>作りたい動画の世界観から探そう。</p><div class="art"></div><div class="chips"><span>映画風</span><span>旅行</span><span>ファッション</span></div><div class="mock-input">どんな動画にしたい？　✎</div><div class="mock-label">あなたのアイデアから、スタイルを探す</div>`;
    }
    function render(){board.innerHTML=ideas.map(idea=>`<article class="concept" style="--accent:${idea.colors[1]}"><div class="concept-text"><span class="number">CONCEPT ${idea.n} / 10</span><h2>${idea.name}</h2><p class="tagline">${idea.tag}</p><ul class="facts">${idea.points.map(p=>`<li>${p}</li>`).join('')}</ul><div class="colors">${idea.colors.map(c=>`<i style="background:${c}" title="${c}"></i>`).join('')}</div>${idea.badge?`<span class="recommend">${idea.badge}</span>`:''}</div><div class="phone" data-theme="${idea.theme}" aria-label="${idea.name}の${current}画面モック"><div class="phone-head"><strong>MOTION<b>•</b></strong><em>FUTURE / 01</em></div><div class="screen" data-screen="${current}">${screenHtml(current,idea)}</div><div class="phone-tabs"><span><b>⌂</b>ホーム</span><span><b>▦</b>探す</span><span><b>♡</b>保存</span><span><b>⚙</b>設定</span></div></div></article>`).join('')}
    document.querySelectorAll('.switcher button').forEach(button=>button.addEventListener('click',()=>{current=button.dataset.screen;document.querySelectorAll('.switcher button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()}));render();
  </script>
</body>
</html>
