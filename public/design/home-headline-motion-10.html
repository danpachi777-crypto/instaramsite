<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MOTION｜ホーム見出しアニメーション 10案</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;background:#050505;color:#fff}
    *{box-sizing:border-box}body{margin:0;background:#050505}button{font:inherit;cursor:pointer}
    .shell{width:min(1460px,calc(100% - 36px));margin:auto;padding:30px 0 70px}
    .top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}
    .eyebrow{color:#9bd9ef;font-size:11px;font-weight:800;letter-spacing:.2em}
    h1{margin:5px 0;font-size:clamp(23px,3vw,38px);line-height:1.3}
    .lead{margin:0;color:#aaa;font-size:13px;line-height:1.7}
    .toggle{flex:none;border:1px solid #555;border-radius:30px;background:#1a1a1a;color:#fff;padding:10px 17px}
    .toggle:hover{background:#292929}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card{min-width:0;overflow:hidden;border:1px solid #30343a;border-radius:15px;background:#111}
    .meta{display:flex;align-items:baseline;gap:12px;padding:15px 18px 11px}
    .number{color:#8adcea;font-size:12px;font-weight:800;letter-spacing:.15em}
    h2{margin:0;font-size:17px}.desc{margin:3px 18px 15px;color:#aaa;font-size:12px;line-height:1.5}
    .stage{position:relative;display:grid;place-items:center;min-height:270px;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 48% 96%,#161735,#050a19 58%,#02050d)}
    .stage::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#04070e91,transparent 30%,transparent 70%,#04070e91)}
    .headline{position:relative;z-index:1;margin:0;padding:15px;text-align:center;font-size:clamp(23px,3.15vw,48px);font-weight:850;line-height:1.45;letter-spacing:-.07em;color:#fff}
    .line{display:block;white-space:nowrap}
    .stage *{animation-play-state:running}
    body.paused .stage *,body.paused .stage::after,body.paused .stage::before{animation-play-state:paused!important}
    .stage-1 .headline{animation:breathe 4.8s ease-in-out infinite}
    @keyframes breathe{0%,100%{transform:scale(.98);opacity:.9}50%{transform:scale(1.045);opacity:1}}
    .stage-2 .headline{background:linear-gradient(105deg,#fff 0%,#fff 32%,#8ceaff 47%,#fff 62%,#fff 100%);background-size:250% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:shimmer 4.2s linear infinite}
    @keyframes shimmer{from{background-position:140% 0}to{background-position:-100% 0}}
    .stage-3 .headline{animation:lift 4s ease-in-out infinite}
    .stage-3 .headline .line:last-child{animation:counterlift 4s ease-in-out infinite}
    @keyframes lift{0%,100%{transform:translateY(5px)}50%{transform:translateY(-6px)}}
    @keyframes counterlift{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
    .stage-4 .headline{animation:neon 3.6s ease-in-out infinite}
    @keyframes neon{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 12px #a8ebffb0,0 0 35px #47baff72,0 0 65px #655bff5c}}
    .stage-5 .headline .char{display:inline-block;animation:letterwave 2.8s ease-in-out infinite;animation-delay:calc(var(--i)*.11s)}
    @keyframes letterwave{0%,35%,100%{transform:translateY(0)}16%{transform:translateY(-11px)}}
    .stage-6 .headline{animation:focuspulse 5s ease-in-out infinite}
    @keyframes focuspulse{0%,100%{filter:blur(1.2px);transform:scale(.985);opacity:.78}45%,65%{filter:blur(0);transform:scale(1.025);opacity:1}}
    .stage-7 .line{position:relative;animation:glitchbase 2s steps(1,end) infinite}
    .stage-7 .line::before,.stage-7 .line::after{content:attr(data-text);position:absolute;inset:0;white-space:nowrap;pointer-events:none;opacity:0}
    .stage-7 .line::before{color:#72e6f5;opacity:.45;transform:translateX(-2px);animation:glitchcyan 2s steps(1,end) infinite}
    .stage-7 .line::after{color:#f478de;opacity:.4;transform:translateX(2px);animation:glitchpink 2s steps(1,end) infinite}
    .stage-7 .line:last-child,.stage-7 .line:last-child::before,.stage-7 .line:last-child::after{animation-delay:.06s}
    @keyframes glitchbase{0%,80%,86%,100%{transform:translateX(0)}81%,83%{transform:translateX(-1.5px)}84%,85%{transform:translateX(1.5px)}}
    @keyframes glitchcyan{0%,80%,86%,100%{opacity:.45;transform:translateX(-2px)}81%,85%{opacity:.72;transform:translateX(-4px)}}
    @keyframes glitchpink{0%,80%,86%,100%{opacity:.4;transform:translateX(2px)}81%,85%{opacity:.68;transform:translateX(4px)}}
    .stage-8::after{content:"";position:absolute;inset:-50%;z-index:0;background:radial-gradient(circle,#bedfff2e,transparent 22%);animation:orbitlight 7s linear infinite}
    .stage-8 .headline{animation:softturn 7s ease-in-out infinite}
    @keyframes orbitlight{0%{transform:translate(-23%,-10%)}25%{transform:translate(18%,-22%)}50%{transform:translate(27%,15%)}75%{transform:translate(-20%,22%)}100%{transform:translate(-23%,-10%)}}
    @keyframes softturn{0%,100%{transform:perspective(600px) rotateY(-3deg)}50%{transform:perspective(600px) rotateY(3deg)}}
    .stage-9 .headline .line{animation:slidefade 5s ease-in-out infinite}
    .stage-9 .headline .line:last-child{animation-delay:.35s}
    @keyframes slidefade{0%,100%{transform:translateX(-14px);opacity:.6}50%{transform:translateX(14px);opacity:1}}
    .stage-10 .headline{animation:reveal 5.3s ease-in-out infinite}
    @keyframes reveal{0%,8%{clip-path:inset(0 100% 0 0);opacity:.7}43%,75%{clip-path:inset(0 0 0 0);opacity:1}94%,100%{clip-path:inset(0 0 0 100%);opacity:.7}}
    @media(max-width:760px){.shell{width:calc(100% - 20px);padding-top:18px}.top{align-items:start}.grid{grid-template-columns:1fr;gap:13px}.stage{min-height:240px}.headline{font-size:clamp(23px,6vw,42px)}.desc{margin-bottom:12px}}
    @media(max-width:430px){.top{display:block}.toggle{margin-top:13px}.headline{font-size:clamp(21px,5.9vw,27px)}.stage{min-height:210px}}
    @media(prefers-reduced-motion:reduce){.stage *, .stage::before, .stage::after{animation:none!important}.stage-2 .headline{background:none;color:#fff}.stage-6 .headline{filter:none;transform:none;opacity:1}.stage-10 .headline{clip-path:none}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div><span class="eyebrow">MOTION / HEADLINE STUDY</span><h1>ホーム見出しの動き・10案</h1><p class="lead">同じ文字と暗い背景で比較できます。動きはすべてループします。</p></div><button class="toggle" type="button" aria-pressed="false">動きを停止</button></div>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    const ideas=[
      ['呼吸する文字','全体がゆっくり拡大・縮小。上品で最も読みやすい。'],
      ['光のスイープ','白文字の中を冷たい光が横切る。映像サービスらしい。'],
      ['上下の浮遊','2行がわずかに異なる方向へ揺れる。立体感が出る。'],
      ['ネオンの鼓動','光彩が明滅する。黒い背景とのコントラストが強い。'],
      ['一文字ずつ波','文字が順番に跳ね上がる。楽しさと動きが伝わる。'],
      ['ピントが合う','わずかなぼけと拡大が循環する。カメラの呼吸感。'],
      ['控えめなグリッチ','たまに色がずれる。近未来的で刺激がある。'],
      ['巡るスポットライト','背景の光が動き、文字も少し角度を変える。'],
      ['行ごとのスライド','上下の行が時間差で左右に流れる。リズムが明快。'],
      ['繰り返すワイプ','文字が左から現れ、右へ消える。タイトル演出に近い。']
    ];
    const line1='想像したシーンを、',line2='次の動画に。';
    const grid=document.querySelector('#grid');
    for(let i=0;i<ideas.length;i++){
      const [name,desc]=ideas[i];
      const card=document.createElement('section');card.className='card';
      card.innerHTML=`<div class="meta"><span class="number">${String(i+1).padStart(2,'0')}</span><h2>${name}</h2></div><p class="desc">${desc}</p><div class="stage stage-${i+1}"><p class="headline" data-copy="${line1}\n${line2}"><span class="line">${line1}</span><span class="line">${line2}</span></p></div>`;
      grid.append(card);
    }
    document.querySelectorAll('.stage-7 .line').forEach(line=>line.setAttribute('data-text',line.textContent));
    document.querySelectorAll('.stage-5 .line').forEach(line=>{line.innerHTML=[...line.textContent].map((char,i)=>`<span class="char" style="--i:${i}">${char}</span>`).join('')});
    document.querySelector('.toggle').addEventListener('click',event=>{const paused=document.body.classList.toggle('paused');event.currentTarget.textContent=paused?'動きを再生':'動きを停止';event.currentTarget.setAttribute('aria-pressed',String(paused))});
  </script>
</body>
</html>
