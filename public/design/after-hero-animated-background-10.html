<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MOTION｜冒頭以外の動く背景 10案</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;background:#050505;color:#f7f8fa}
    *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #9de8f1;outline-offset:3px}
    .shell{width:min(1500px,calc(100% - 36px));margin:auto;padding:30px 0 80px}
    .intro{margin-bottom:24px}.eyebrow{color:#9de8f1;font-size:11px;font-weight:800;letter-spacing:.17em}
    h1{margin:5px 0;font-size:clamp(25px,3vw,40px);line-height:1.3}.intro p{margin:0;color:#aaa;font-size:13px;line-height:1.7}
    .pause{margin-top:14px;padding:8px 14px;border:1px solid #555;border-radius:24px;background:#1b1b1b;color:#fff;font-size:12px}.pause:hover{border-color:#9de8f1}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    .option{min-width:0;border:1px solid #333;border-radius:14px;overflow:hidden;background:#101010}
    .option-head{display:flex;align-items:center;gap:11px;padding:14px 17px 8px}.number{color:#9de8f1;font-size:12px;font-weight:800;letter-spacing:.15em}
    h2{margin:0;font-size:17px}.description{margin:0 17px 13px;color:#aaa;font-size:12px;line-height:1.5}
    .expand{margin-left:auto;padding:5px 10px;border:1px solid #555;border-radius:30px;background:#1b1b1b;color:#ddd;font-size:11px}.expand:hover{border-color:#9de8f1;color:#fff}
    .mock{position:relative;isolation:isolate;min-height:420px;overflow:hidden;padding:30px 25px 28px;border-top:1px solid #333;background-color:#080808}
    .mock::before,.mock::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none}
    .mock-kicker{display:block;color:#a9e7ee;font-size:10px;font-weight:800;letter-spacing:.17em}.mock h3{margin:7px 0 5px;font-size:clamp(23px,2.3vw,33px);line-height:1.25}.mock-lead{margin:0 0 19px;color:#c0c5cb;font-size:12px}
    .promo{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;padding:14px 18px;border:1px solid #ffffff25;border-radius:9px;background:#ffffff0b;backdrop-filter:blur(5px)}
    .promo strong{font-size:14px}.promo span{color:#bfc5cb;font-size:11px}.promo i{color:#a9e7ee;font-size:20px;font-style:normal}
    .previews{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.preview{min-width:0;overflow:hidden;border:1px solid #ffffff20;border-radius:8px;background:#181818}
    .preview img{display:block;width:100%;height:112px;object-fit:cover}.preview span{display:block;padding:5px 7px;overflow:hidden;color:#eef4f6;font-size:10px;font-weight:700;white-space:nowrap;text-overflow:ellipsis}
    .style-1{background:#050505}.style-1 .promo,.style-1 .preview{border-color:#2c2c2c;background:#0d0d0d}
    .style-2{background:linear-gradient(155deg,#1b1d20,#0d0e10 45%,#17191c)}.style-2 .promo,.style-2 .preview{background:#ffffff10;box-shadow:0 10px 30px #0005}
    .style-3{background:radial-gradient(ellipse 48% 42% at 25% 0%,#6b748536,transparent 100%),radial-gradient(ellipse 45% 42% at 86% 5%,#67738522,transparent 100%),#07090b}
    .style-4{background:radial-gradient(circle at 7% 15%,#05809b56,transparent 36%),radial-gradient(circle at 95% 88%,#1b5c7959,transparent 36%),#050a10}
    .style-5{background:linear-gradient(#9ce6fa0b 1px,transparent 1px),linear-gradient(90deg,#9ce6fa0b 1px,transparent 1px),radial-gradient(circle at 50% 15%,#12334b,#05080c 66%);background-size:24px 24px,24px 24px,auto}
    .style-6{background:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 4px),radial-gradient(circle at 50% 50%,#24211f,#080707 75%)}.style-6::after{background:linear-gradient(110deg,#ffffff04,transparent 45%,#ffffff06);mix-blend-mode:screen}
    .style-7{background:repeating-radial-gradient(ellipse 55% 40% at 83% 20%,transparent 0 23px,#7fc9d81c 24px 25px,transparent 26px 43px),#070a0e}
    .style-8{background:linear-gradient(115deg,transparent 20%,#a6d7e91a 34%,transparent 45%),linear-gradient(115deg,transparent 55%,#8e78e91b 69%,transparent 82%),#07080d}
    .style-9{background:linear-gradient(0deg,#1466816b,transparent 35%),radial-gradient(ellipse 100% 18% at 50% 100%,#74d8e54d,transparent 80%),#06080b}
    .style-10{background:radial-gradient(ellipse 65% 35% at 20% 0%,#4e40a34a,transparent 90%),radial-gradient(ellipse 65% 42% at 98% 60%,#1b91a453,transparent 85%),radial-gradient(ellipse 50% 35% at 45% 95%,#b3488440,transparent 90%),#080811}
    /* Every option below has a patterned background with its own continuous motion. */
    .mock::before,.mock::after{z-index:0}.mock>*{position:relative;z-index:1}
    .style-1{background:#070a11}.style-1::before{background:radial-gradient(ellipse 65% 55% at 20% 30%,#4e8acb70,transparent 75%),radial-gradient(ellipse 60% 55% at 78% 58%,#723bd37a,transparent 78%),radial-gradient(ellipse 45% 55% at 55% 90%,#20a1a469,transparent 78%);filter:blur(27px);animation:aurora 11s ease-in-out infinite alternate}
    .style-2{background:linear-gradient(#72e6f51b 1px,transparent 1px),linear-gradient(90deg,#72e6f51b 1px,transparent 1px),#061017;background-size:27px 27px,27px 27px,auto}.style-2::before{background:linear-gradient(transparent 15%,#73e5fa1f 48%,#73e5fa65 50%,#73e5fa1f 52%,transparent 85%);animation:scan 4.2s linear infinite}.style-2::after{background:linear-gradient(90deg,transparent 45%,#4de3ff17 50%,transparent 55%);animation:scan-side 9s linear infinite}
    .style-3{background:radial-gradient(circle at 50% 120%,#1d3560,#050711 70%)}.style-3::before{inset:-35%;background-image:radial-gradient(circle,#d9f7ffb5 1px,transparent 1.7px),radial-gradient(circle,#88d9ff8c 1px,transparent 1.7px);background-size:37px 43px,67px 73px;background-position:0 0,23px 31px;animation:star-drift 15s linear infinite}.style-3::after{background:linear-gradient(115deg,transparent 42%,#bdefff88 49%,transparent 54%);opacity:.35;animation:comet 7s ease-in-out infinite}
    .style-4{background:repeating-linear-gradient(135deg,#07111b 0 23px,#0a1d2c 24px 25px,#07111b 26px 48px)}.style-4::before{inset:-50%;background:linear-gradient(115deg,transparent 42%,#48d8fa52 47%,transparent 52%,transparent 61%,#ad71f03f 65%,transparent 70%);animation:beam 7s linear infinite}.style-4::after{background:linear-gradient(0deg,#12213d8c,transparent 65%)}
    .style-5{background:#080b13}.style-5::before{inset:-25%;background:repeating-radial-gradient(ellipse 50% 45% at 50% 50%,transparent 0 22px,#8fe8ff32 23px 24px,transparent 25px 47px);animation:rings 9s ease-in-out infinite}.style-5::after{background:radial-gradient(circle at 50% 45%,#6687c029,transparent 52%);animation:pulse 5s ease-in-out infinite}
    .style-6{background:#0a0910}.style-6::before{inset:-30%;background:radial-gradient(circle at 22% 22%,#b45dd96b,transparent 25%),radial-gradient(circle at 78% 44%,#2daec983,transparent 31%),radial-gradient(circle at 37% 83%,#665ae078,transparent 30%);filter:blur(18px);animation:blobs 13s ease-in-out infinite alternate}.style-6::after{background:repeating-linear-gradient(0deg,#ffffff08 0 1px,transparent 1px 5px)}
    .style-7{background:linear-gradient(90deg,#031007,#07150c 50%,#031007)}.style-7::before{background-image:radial-gradient(ellipse 1px 15px at 14% 8%,#70f6b29c,transparent),radial-gradient(ellipse 1px 23px at 59% 33%,#70f6b277,transparent),radial-gradient(ellipse 1px 18px at 83% 68%,#70f6b2a5,transparent);background-size:88px 125px,131px 164px,107px 141px;animation:digital-rain 4s linear infinite}.style-7::after{background:linear-gradient(0deg,#43e2931e,transparent 50%)}
    .style-8{background:linear-gradient(45deg,#89baf015 25%,transparent 25% 75%,#89baf015 75%),linear-gradient(45deg,#89baf015 25%,transparent 25% 75%,#89baf015 75%),#090d16;background-size:35px 35px;background-position:0 0,17px 17px}.style-8::before{inset:-20%;background:radial-gradient(ellipse 25% 35% at 20% 50%,#d5efff52,transparent 100%);animation:tile-light 8s linear infinite}.style-8::after{background:linear-gradient(0deg,#0009,transparent 70%)}
    .style-9{background:linear-gradient(0deg,#144b6b,#050a13 55%)}.style-9::before{inset:20% -30% -50%;background:repeating-radial-gradient(ellipse 80% 27% at 50% 95%,transparent 0 17px,#6ee4ff59 18px 19px,transparent 20px 34px);transform:perspective(450px) rotateX(45deg);animation:horizon-wave 7s ease-in-out infinite}.style-9::after{background:radial-gradient(ellipse 100% 23% at 50% 100%,#93ecff65,transparent);animation:pulse 4s ease-in-out infinite}
    .style-10{background:radial-gradient(circle at 40% 50%,#292534,#0c0b10 70%)}.style-10::before{background:repeating-linear-gradient(0deg,#ffffff0b 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,#ffffff04 0 1px,transparent 1px 5px);animation:film-shift .22s steps(2,end) infinite}.style-10::after{inset:-25%;background:linear-gradient(110deg,transparent 34%,#cee5ff24 49%,transparent 62%);animation:film-light 8s ease-in-out infinite}
    @keyframes aurora{from{transform:translate(-5%,-4%) rotate(-8deg) scale(1)}to{transform:translate(6%,5%) rotate(9deg) scale(1.17)}}
    @keyframes scan{from{transform:translateY(-85%)}to{transform:translateY(85%)}}
    @keyframes scan-side{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
    @keyframes star-drift{from{transform:translateY(0)}to{transform:translateY(115px)}}
    @keyframes comet{0%,25%{transform:translateX(-110%);opacity:0}45%{opacity:.4}65%,100%{transform:translateX(110%);opacity:0}}
    @keyframes beam{from{transform:translateX(-35%) rotate(-3deg)}to{transform:translateX(35%) rotate(3deg)}}
    @keyframes rings{0%,100%{transform:scale(.9) rotate(-5deg);opacity:.55}50%{transform:scale(1.13) rotate(5deg);opacity:1}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes blobs{from{transform:translate(-6%,2%) rotate(-12deg)}to{transform:translate(7%,-5%) rotate(13deg)}}
    @keyframes digital-rain{from{background-position:0 -125px,0 -164px,0 -141px}to{background-position:0 125px,0 164px,0 141px}}
    @keyframes tile-light{from{transform:translateX(-38%)}to{transform:translateX(115%)}}
    @keyframes horizon-wave{0%,100%{transform:perspective(450px) rotateX(45deg) translateY(7%)}50%{transform:perspective(450px) rotateX(45deg) translateY(-7%)}}
    @keyframes film-shift{0%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}100%{transform:translate(0,0)}}
    @keyframes film-light{from{transform:translateX(-55%)}to{transform:translateX(55%)}}
    body.paused .mock,body.paused .mock::before,body.paused .mock::after{animation-play-state:paused!important}
    @media(prefers-reduced-motion:reduce){.mock,.mock::before,.mock::after{animation:none!important}}
    dialog{width:min(1120px,calc(100% - 24px));max-height:calc(100vh - 28px);padding:0;border:1px solid #555;border-radius:15px;background:#101010;color:#fff;overflow:auto}
    dialog::backdrop{background:#000c}.dialog-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px}.dialog-bar strong{font-size:15px}.close{padding:7px 12px;border:1px solid #555;border-radius:20px;background:#222;color:#fff}.dialog-mock .mock{min-height:640px;padding:48px}.dialog-mock .mock h3{font-size:42px}.dialog-mock .preview img{height:250px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}.mock{min-height:400px}.shell{width:calc(100% - 20px);padding-top:18px}}
    @media(max-width:500px){.mock{min-height:350px;padding:20px 13px}.mock h3{font-size:23px}.promo{padding:10px}.promo strong{font-size:12px}.promo span{font-size:9px}.preview img{height:90px}.dialog-mock .mock{padding:22px;min-height:470px}.dialog-mock .mock h3{font-size:27px}.dialog-mock .preview img{height:150px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="intro"><span class="eyebrow">MOTION / ANIMATED BACKGROUND STUDY</span><h1>冒頭より下の動く背景・10案</h1><p>すべて模様や光が動く背景です。同じ内容で比較し、「拡大」で広い画面の見え方を確認できます。</p><button class="pause" type="button" aria-pressed="false">動きを停止</button></header>
    <div class="grid" id="grid"></div>
  </main>
  <dialog id="large"><div class="dialog-bar"><strong id="dialog-title"></strong><button class="close" type="button">閉じる ✕</button></div><div class="dialog-mock"></div></dialog>
  <script>
    const options=[
      ['流れるオーロラ','青・紫・シアンの光がゆっくり漂う。'],
      ['走査グリッド','細い方眼の上を光のスキャンが通る。'],
      ['星のドリフト','小さな光点が移動し、ときどき光が横切る。'],
      ['斜めのネオン光束','斜線模様の上を2色の光束が横切る。'],
      ['広がる波紋','同心円がゆっくり拡大して呼吸する。'],
      ['漂うカラーブロブ','ぼけた色の塊が形を変えながら動く。'],
      ['デジタルレイン','短い緑の光が縦方向に流れる。'],
      ['光るタイル','細かなタイル模様の上を光が移動する。'],
      ['地平線の波','奥へ続く曲線が上下に揺れる。'],
      ['フィルムノイズ','細かな粒子が揺れ、淡い光が横切る。']
    ];
    const mock=(i)=>`<div class="mock style-${i+1}"><span class="mock-kicker">FEATURED STYLES / MOTION</span><h3>次の「つくりたい」を見つけよう。</h3><p class="mock-lead">ひとつのスタイルを、3つのイメージから。</p><div class="promo"><div><strong>アイデアに、動きと広がりを。</strong><br><span>気になるスタイルを保存して、次の制作のヒントに。</span></div><i aria-hidden="true">↗</i></div><div class="previews"><div class="preview"><img src="/demo/runway-walk.jpg" alt="ランウェイウォークのイメージ"><span>ランウェイウォーク</span></div><div class="preview"><img src="/demo/floating-product.jpg" alt="浮かぶ商品のイメージ"><span>浮かぶ商品</span></div><div class="preview"><img src="/demo/sunset-portrait.jpg" alt="夕暮れのポートレートのイメージ"><span>夕暮れのポートレート</span></div></div></div>`;
    const grid=document.querySelector('#grid');
    options.forEach(([title,description],i)=>{const section=document.createElement('section');section.className='option';section.innerHTML=`<div class="option-head"><span class="number">${String(i+1).padStart(2,'0')}</span><h2>${title}</h2><button class="expand" type="button" data-index="${i}" aria-label="${title}を拡大">拡大 ↗</button></div><p class="description">${description}</p>${mock(i)}`;grid.append(section)});
    const dialog=document.querySelector('#large');
    grid.addEventListener('click',event=>{const button=event.target.closest('.expand');if(!button)return;const i=Number(button.dataset.index);document.querySelector('#dialog-title').textContent=`${String(i+1).padStart(2,'0')} · ${options[i][0]}`;document.querySelector('.dialog-mock').innerHTML=mock(i);dialog.showModal()});
    document.querySelector('.close').addEventListener('click',()=>dialog.close());
    dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
    document.querySelector('.pause').addEventListener('click',event=>{const paused=document.body.classList.toggle('paused');event.currentTarget.textContent=paused?'動きを再生':'動きを停止';event.currentTarget.setAttribute('aria-pressed',String(paused))});
  </script>
</body>
</html>
