<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MOTION｜探すタブの「テンプレート」文字アニメーション 10案</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;background:#050505;color:#f6f8fa}
    *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #9feaf5;outline-offset:3px}
    .shell{width:min(1450px,calc(100% - 32px));margin:auto;padding:26px 0 70px}
    .intro{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:22px}.eyebrow{color:#a5e9f3;font-size:11px;font-weight:800;letter-spacing:.16em}
    h1{margin:4px 0;font-size:clamp(25px,3.2vw,39px)}.intro p{margin:0;color:#aaa;font-size:12px;line-height:1.6}
    .toggle{flex:none;padding:9px 15px;border:1px solid #55616a;border-radius:24px;background:#19232a;color:#fff;font-size:12px}.toggle:hover{background:#263945}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
    .option{min-width:0;overflow:hidden;border:1px solid #37424c;border-radius:13px;background:#0c1014}
    .option-head{display:flex;align-items:baseline;gap:10px;padding:13px 16px 8px}.number{color:#a9edf3;font-size:12px;font-weight:800;letter-spacing:.1em}.option h2{margin:0;font-size:16px}
    .description{margin:0 16px 12px;color:#aab5bd;font-size:11px;line-height:1.5}
    .stage{position:relative;isolation:isolate;min-height:260px;overflow:hidden;padding:22px;background:#020509 url('/design/catalog-bg-02.jpg') center / cover no-repeat}
    .stage::before{content:"";position:absolute;z-index:0;inset:0;background:linear-gradient(90deg,#020408cf,#020408a8 55%,#020408a0)}
    .sample{position:relative;z-index:1}.title{display:table;margin:0 0 7px;color:#fff;font-size:clamp(35px,5vw,65px);font-weight:850;line-height:1.15;letter-spacing:-.05em;white-space:nowrap;transform-origin:center left}
    .sub{margin:0 0 15px;color:#d6e3e8;font-size:11px}.filters{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap}.filters span{padding:4px 9px;border:1px solid #bcebf16b;border-radius:20px;background:#0b1822c9;color:#eef9fb;font-size:10px}.filters span:first-child{background:#a7e9f2;color:#071015;font-weight:800}
    .thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.thumb{height:61px;overflow:hidden;border:1px solid #ffffff30;border-radius:5px;background:#111}.thumb img{width:100%;height:100%;object-fit:cover}
    .option-1 .title{animation:chromatic 2s steps(1,end) infinite;text-shadow:-2px 0 #72e6f5,2px 0 #f478de}
    @keyframes chromatic{0%,80%,86%,100%{transform:translateX(0);text-shadow:-2px 0 #72e6f5,2px 0 #f478de}81%,83%{transform:translateX(-1px);text-shadow:-5px 0 #72e6f5,5px 0 #f478de}84%,85%{transform:translateX(1px);text-shadow:-3px 0 #72e6f5,3px 0 #f478de}}
    .option-2 .title{background:linear-gradient(110deg,#fff 0 32%,#77e7f7 46%,#fff 60% 100%);background-size:240% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:shimmer 3.8s linear infinite}
    @keyframes shimmer{from{background-position:130% 0}to{background-position:-100% 0}}
    .option-3 .title{animation:neon 3.2s ease-in-out infinite}
    @keyframes neon{0%,100%{text-shadow:0 0 7px #a9edfa44,0 0 14px #3a91ae30}50%{text-shadow:0 0 10px #c7f7ffdd,0 0 28px #50cce5ad,0 0 55px #228dc285}}
    .option-4 .title{color:transparent;-webkit-text-stroke:1.4px #d7faff;animation:outline-fill 4s ease-in-out infinite}
    @keyframes outline-fill{0%,100%{color:transparent;text-shadow:none}50%{color:#d7faff;text-shadow:0 0 18px #61dcef77}}
    .option-5 .title{animation:lift 3.6s ease-in-out infinite}
    @keyframes lift{0%,100%{transform:translateY(5px);opacity:.82}50%{transform:translateY(-6px);opacity:1}}
    .option-6 .char{display:inline-block;animation:wave 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
    @keyframes wave{0%,40%,100%{transform:translateY(0)}18%{transform:translateY(-10px)}}
    .option-7 .title{animation:reveal 4.2s ease-in-out infinite}
    @keyframes reveal{0%,6%{clip-path:inset(0 100% 0 0);opacity:.5}42%,78%{clip-path:inset(0 0 0 0);opacity:1}95%,100%{clip-path:inset(0 0 0 100%);opacity:.5}}
    .option-8 .title{animation:tilt 5s ease-in-out infinite}
    @keyframes tilt{0%,100%{transform:perspective(550px) rotateY(-8deg)}50%{transform:perspective(550px) rotateY(8deg)}}
    .option-9 .title{animation:stretch 4s ease-in-out infinite}
    @keyframes stretch{0%,100%{letter-spacing:-.05em;transform:scaleX(.97)}50%{letter-spacing:.04em;transform:scaleX(1.02)}}
    .option-10 .title{animation:glow-drift 6s linear infinite}
    @keyframes glow-drift{0%,100%{text-shadow:-6px -3px 18px #4bb7edaa,6px 3px 18px #c65bde88}25%{text-shadow:6px -3px 18px #4bb7edaa,-6px 3px 18px #c65bde88}50%{text-shadow:6px 3px 18px #4bb7edaa,-6px -3px 18px #c65bde88}75%{text-shadow:-6px 3px 18px #4bb7edaa,6px -3px 18px #c65bde88}}
    body.paused .title,body.paused .char{animation-play-state:paused!important}
    @media(max-width:760px){.shell{width:calc(100% - 18px);padding-top:15px}.grid{grid-template-columns:1fr;gap:12px}.stage{min-height:245px}.title{font-size:clamp(37px,11vw,60px)}}
    @media(max-width:430px){.intro{display:block}.toggle{margin-top:12px}.stage{padding:16px}.title{font-size:clamp(36px,11vw,47px)}.thumbs .thumb:last-child{display:none}.thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(prefers-reduced-motion:reduce){.title,.char{animation:none!important}.option-2 .title{background:none;color:#fff}.option-4 .title{color:#fff}.option-7 .title{clip-path:none}}
  </style>
</head>
<body>
  <main class="shell"><header class="intro"><div><span class="eyebrow">MOTION / CATALOG TITLE STUDY</span><h1>「テンプレート」の文字アニメーション・10案</h1><p>現在の「探す」タブに近い背景とカードで比較できます。文字の動きだけを変えています。</p></div><button class="toggle" type="button" aria-pressed="false">動きを停止</button></header><div class="grid" id="grid"></div></main>
  <script>
    const ideas=[
      ['色ずれグリッチ','青とピンクの色ずれを常時表示し、ときどき強める。'],
      ['光のスイープ','シアンの光が文字の中を横切る。'],
      ['ネオンの呼吸','発光の強さがゆっくり変わる。'],
      ['輪郭から塗りへ','アウトラインが白文字に変わる。'],
      ['上下の浮遊','見出し全体がゆっくり浮き沈みする。'],
      ['一文字ずつ波','文字が左から順に軽く跳ねる。'],
      ['左右ワイプ','左から現れ、右へ抜けて繰り返す。'],
      ['立体の首振り','浅い3D角度で左右に傾く。'],
      ['伸び縮み','字間が広がり、また引き締まる。'],
      ['巡る光彩','青と紫の光が文字の周りを移動する。']
    ];
    const thumbs=['runway-walk','floating-product','sunset-portrait','cinematic-car'].map(slug=>`<div class="thumb"><img src="/demo/${slug}.jpg" alt="" loading="lazy"></div>`).join('');
    const grid=document.querySelector('#grid');
    ideas.forEach(([name,description],i)=>{const card=document.createElement('section');card.className=`option option-${i+1}`;card.innerHTML=`<div class="option-head"><span class="number">${String(i+1).padStart(2,'0')}</span><h2>${name}</h2></div><p class="description">${description}</p><div class="stage"><div class="sample"><div class="title">テンプレート</div><p class="sub">ひらめきに出会う、小さなスタイルライブラリー。</p><div class="filters"><span>すべて</span><span>ファッション</span><span>商品</span><span>ライフスタイル</span></div><div class="thumbs">${thumbs}</div></div></div>`;grid.append(card)});
    const wave=document.querySelector('.option-6 .title');wave.innerHTML=[...wave.textContent].map((char,i)=>`<span class="char" style="--i:${i}">${char}</span>`).join('');
    document.querySelector('.toggle').addEventListener('click',event=>{const paused=document.body.classList.toggle('paused');event.currentTarget.textContent=paused?'動きを再生':'動きを停止';event.currentTarget.setAttribute('aria-pressed',String(paused))});
  </script>
</body>
</html>
